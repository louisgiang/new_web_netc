:${d[3].replace(/\\D/g,'')}\">${d[3]}<\/a>`]))}`)}\n      ${sec('gt-van-ban','08','Văn bản pháp lý',`${A.laws.map(l=>`<h3 class=\"h3s\">${l.t}<\/h3><ul class=\"ulist\">${l.items.map(i=>`<li>${i}<\/li>`).join('')}<\/ul>`).join('')}<h3 class=\"h3s\">8.4 Quy chuẩn, tiêu chuẩn<\/h3><p class=\"cap\">Đối với ô tô, động cơ<\/p>${tbl(['Số hiệu','Tên văn bản'],A.stdCar.map(r=>[`<b>${r[0]}<\/b>`,r[1]]))}<p class=\"cap\">Đối với xe mô tô, xe gắn máy<\/p>${tbl(['Số hiệu','Tên văn bản'],A.stdMoto.map(r=>[`<b>${r[0]}<\/b>`,r[1]]))}`)}\n    <\/div><aside class=\"side\"><div class=\"side-b sticky\"><h4>Trong chuyên mục này<\/h4>${ABOUT_TOC.map(t=>`<a href=\"#gioi-thieu/${t[0]}\" data-toc=\"${t[0]}\">${t[1]}<\/a>`).join('')}<\/div>\n      <div class=\"side-b\"><h4>Lãnh đạo đơn vị<\/h4>${A.leaders.map(l=>`<div class=\"ldr\"><small>${l[1]}<\/small><b>${l[0]}<\/b><a href=\"tel:${l[2].replace(/\\D/g,'')}\">☎ ${l[2]}<\/a><\/div>`).join('')}<\/div><\/aside><\/div>`;\n  },\n\n  'tin-tuc'(sub){\n    if (sub && sub.startsWith('tin-')){\n      const n = newsBy(sub); if(!n) return PAGES['tin-tuc']();\n      const gl = n.grp==='chung'?'chung':'chuyen-nganh';\n      const rel = NEWS.filter(x=>x.grp===n.grp && x.id!==n.id);\n      return pageHead(esc(n.title),[['#tin-tuc','Tin tức'],[`#tin-tuc/${gl}`,GRP[n.grp]],['','Chi tiết']],'',`${GRP[n.grp]} · ${n.date}`) +\n      `<div class=\"wrap layout\"><div class=\"main\"><article class=\"article\"><div class=\"art-cover\"><span>${GRP[n.grp]}<\/span><\/div><p class=\"art-date\">📅 ${n.date}<\/p><p class=\"art-body\">${esc(n.body)}<\/p>\n        <div class=\"art-foot\"><a class=\"btn b2 sm\" href=\"#tin-tuc/${gl}\">« Quay lại ${GRP[n.grp].toLowerCase()}<\/a><\/div><\/article>\n        <h3 class=\"h3s\">Tin khác cùng chuyên mục<\/h3><div class=\"nlist\">${rel.map(newsRow).join('')}<\/div><\/div>\n        <aside class=\"side\">${asideNews()}<\/aside><\/div>`;\n    }\n    const f = sub==='chung'?'chung':sub==='chuyen-nganh'?'nganh':'all';\n    const list = NEWS.filter(n=>f==='all'||n.grp===f);\n    const title = f==='all'?'Tin tức':GRP[f];\n    return pageHead(title,[['#tin-tuc','Tin tức'],...(f==='all'?[]:[['',GRP[f]]])],'Thay đổi quy trình, lịch bảo trì hệ thống, lịch nghỉ lễ và tin chuyên ngành của Trung tâm.','Newsroom') +\n    `<div class=\"wrap layout\"><div class=\"main\"><div class=\"pills\"><a href=\"#tin-tuc\" class=\"${f==='all'?'on':''}\">Tất cả<\/a><a href=\"#tin-tuc/chung\" class=\"${f==='chung'?'on':''}\">Tin tức chung<\/a><a href=\"#tin-tuc/chuyen-nganh\" class=\"${f==='nganh'?'on':''}\">Tin tức chuyên ngành<\/a><\/div>\n      <div class=\"nlist\">${list.map(newsRow).join('')}<\/div><\/div><aside class=\"side\">${asideNews()}<\/aside><\/div>`;\n  },\n\n  'dich-vu'(sub){\n    const s = svcBy((sub||'').split('/')[0]);\n    const side = `<div class=\"side-b\"><h4>Các dịch vụ<\/h4>${SERVICES.map(x=>`<a href=\"#dich-vu/${x.id}\" class=\"${s&&s.id===x.id?'on':''}\">${x.short}<\/a>`).join('')}<\/div>\n      <div class=\"side-b side-cta\"><h4>Ước tính chi phí<\/h4><p>Trợ lý ảo đưa ra khoảng giá tạm tính theo từng loại hình trước khi bạn nộp hồ sơ.<\/p><button class=\"btn b1 sm\" onclick=\"ask('Báo giá tạm tính')\">Hỏi báo giá tạm tính<\/button><\/div>`;\n    if (s){\n      return pageHead(s.name,[['#dich-vu','Dịch vụ'],['',s.short]],s.lead,s.code) +\n      `<div class=\"wrap layout\"><div class=\"main\">\n        <div class=\"svc-hero sv-${s.id}\"><div><span class=\"tag\">${s.code}<\/span><div class=\"kp\"><div><small>Giá tạm tính*<\/small><b>${s.price}<\/b><\/div><\/div><\/div><\/div>\n        <section class=\"blk\"><h2>Mô tả dịch vụ<\/h2><p>${s.desc}<\/p><div class=\"chips-s\">${s.tags.map(t=>`<span>${t}<\/span>`).join('')}<\/div><\/section>\n        <section class=\"blk\"><h2>Thông tin cần biết<\/h2><dl class=\"dl\">${s.rows.map(r=>`<dt>${r[0]}<\/dt><dd>${r[1]}<\/dd>`).join('')}<\/dl><p class=\"fnote\">* Giá tạm tính, chưa gồm VAT, mang tính tham khảo. Giá chính thức theo thông báo giá của Trung tâm.<\/p><\/section>\n        <section class=\"blk\" id=\"dang-ky\"><h2>Đăng ký thử nghiệm<\/h2>${regForm(s.id)}<\/section>\n        <h3 class=\"h3s\">Dịch vụ khác<\/h3><div class=\"g2\">${SERVICES.filter(x=>x.id!==s.id).map(x=>`<a class=\"card link\" href=\"#dich-vu/${x.id}\"><small>${x.code}<\/small><h3>${x.short}<\/h3><p>${x.lead}<\/p><\/a>`).join('')}<\/div>\n      <\/div><aside class=\"side\">${side}<\/aside><\/div>`;\n    }\n    return pageHead('Dịch vụ thử nghiệm',[['#dich-vu','Dịch vụ']],'Các loại hình dịch vụ Trung tâm cung cấp, kèm phạm vi áp dụng, hồ sơ cần chuẩn bị.','Services') +\n    `<div class=\"wrap layout\"><div class=\"main\">\n      ${SERVICES.map((x,i)=>`<section class=\"svc-row\"><div class=\"sr-n\">0${i+1}<\/div><div class=\"sr-b\"><h2>${x.name}<\/h2><p>${x.desc}<\/p><dl class=\"dl\">${x.rows.map(r=>`<dt>${r[0]}<\/dt><dd>${r[1]}<\/dd>`).join('')}<\/dl><a class=\"more\" href=\"#dich-vu/${x.id}\">Xem chi tiết & đăng ký →<\/a><\/div><\/section>`).join('')}\n      <section class=\"blk\" id=\"dang-ky\"><h2>Đăng ký thử nghiệm<\/h2><p>Gửi thông tin bên dưới, cán bộ tiếp nhận sẽ liên hệ để hướng dẫn hoàn thiện hồ sơ và ban hành thông báo giá.<\/p>${regForm('moto')}<\/section>\n    <\/div><aside class=\"side\">${side}<\/aside><\/div>`;\n  },\n\n  'quy-trinh'(){\n    return pageHead('Quy trình xử lý hồ sơ thử nghiệm',[['#quy-trinh','Quy trình']],'Năm bước từ đăng ký đến khi nhận kết quả.','Process') +\n    `<div class=\"wrap layout\"><div class=\"main\">\n      <div class=\"tl\">${STEPS.map((s,i)=>`<div class=\"tl-i\"><div class=\"tl-n\">${i+1}<\/div><div class=\"tl-b\"><h3>${s.t}<\/h3><p>${s.d}<\/p><\/div><\/div>`).join('')}<\/div>\n    <\/div><aside class=\"side\"><div class=\"side-b\"><h4>Chuẩn bị trước khi nộp<\/h4>${CHECKLIST.map(c=>`<label class=\"chk\"><input type=\"checkbox\"> ${c}<\/label>`).join('')}<\/div>\n      <div class=\"side-b side-cta\"><h4>Tài khoản khách hàng<\/h4><p>Đăng nhập để theo dõi trạng thái hồ sơ của đơn vị theo thời gian thực.<\/p><div><a class=\"btn b1 sm\" href=\"#dashboard\">Đăng nhập<\/a><\/div><\/div>\n      <div class=\"side-b\"><h4>Bắt đầu<\/h4><a href=\"#dich-vu\">Đăng ký thử nghiệm →<\/a><\/div><\/aside><\/div>`;\n  },\n\n  'lien-he'(){\n    const info = [['🏛','Tên đơn vị',ORG.name],['📍','Địa chỉ',ORG.addr],['☎','Điện thoại',`<a href=\"tel:${ORG.telRaw}\">${ORG.tel}<\/a>`],['📠','Fax',ORG.fax],['✉','Email chung',`<a href=\"mailto:${ORG.email}\">${ORG.email}<\/a>`],['🕗','Giờ làm việc',ORG.hours]];\n    return pageHead('Liên hệ',[['#lien-he','Liên hệ']],'Địa chỉ, đầu mối liên hệ theo từng nội dung công việc và giờ làm việc của Trung tâm.','Contact') +\n    `<div class=\"wrap\"><div class=\"g3 info\">${info.map(i=>`<div class=\"card\"><span class=\"ic\">${i[0]}<\/span><small>${i[1]}<\/small><p>${i[2]}<\/p><\/div>`).join('')}<\/div>\n      <div class=\"layout\"><div class=\"main\">\n        <section class=\"blk\"><h2>Đầu mối theo nội dung công việc<\/h2>${tbl(['Nội dung / Bộ phận','Cán bộ hướng dẫn','Điện thoại'],CONTACTS.map(c=>[c[0],c[1],`<a href=\"tel:${c[2].replace(/\\D/g,'')}\">${c[2]}<\/a>`]))}<\/section>\n        <section class=\"blk\"><h2>Gửi câu hỏi cho Trung tâm<\/h2><form class=\"form\" data-form=\"ask\">\n          <div class=\"fg2\"><label>Họ và tên *<input required name=\"name\"><\/label><label>Email nhận trả lời *<input required type=\"email\" name=\"email\"><\/label><\/div>\n          <label>Nội dung cần hỗ trợ<select name=\"topic\"><option>Hồ sơ và thủ tục<\/option><option>Báo giá và thanh toán<\/option><option>Tiến độ hồ sơ<\/option><option>Nội dung kỹ thuật<\/option><\/select><\/label>\n          <label>Câu hỏi *<textarea required rows=\"4\" name=\"q\"><\/textarea><\/label><button class=\"btn b1\">Gửi câu hỏi<\/button><\/form><\/section>\n        <section class=\"blk\"><h2>Chỉ đường<\/h2><p>${ORG.addr}<\/p><div class=\"map\"><div class=\"map-fb\">Bản đồ cần kết nối Internet · ${ORG.lat}° N, ${ORG.lng}° E<\/div><iframe loading=\"lazy\" src=\"https://www.google.com/maps?q=${ORG.lat},${ORG.lng}&z=15&output=embed\" title=\"Bản đồ NETC\"><\/iframe><\/div><a class=\"btn b2 sm\" target=\"_blank\" href=\"https://www.google.com/maps?q=${ORG.lat},${ORG.lng}\">Mở Google Maps<\/a><\/section>\n      <\/div><aside class=\"side\">${asideHelp()}<\/aside><\/div><\/div>`;\n  },\n\n  'dashboard'(){\n    return pageHead('Đăng nhập khách hàng',[['#dashboard','Đăng nhập']],'Đăng nhập để xem và theo dõi toàn bộ hồ sơ thử nghiệm của đơn vị.','Customer login') +\n    `<div class=\"wrap\"><div class=\"g2 dash\">\n      <div class=\"card\"><h3>Đăng nhập<\/h3><form class=\"form\" data-form=\"login\"><label>Email đăng nhập<input type=\"email\" required><\/label><label>Mật khẩu<input type=\"password\" required><\/label><button class=\"btn b1\">Đăng nhập<\/button><\/form>\n        <p class=\"fnote\"><a href=\"javascript:ask('Quên mật khẩu')\">Quên mật khẩu?<\/a><\/p><\/div>\n      <div class=\"card\"><h3>Chưa có tài khoản?<\/h3><p>Tạo tài khoản doanh nghiệp để nộp hồ sơ trực tuyến và theo dõi tiến độ.<\/p>\n        <ol class=\"ulist steps-acc\"><li>Chọn “Tạo tài khoản”, nhập mã số thuế, tên đơn vị, email và số điện thoại người liên hệ.<\/li><li>Xác thực mã OTP gửi về email.<\/li><li>NETC duyệt tài khoản.<\/li><li>Đăng nhập bằng email và mật khẩu đã đặt.<\/li><\/ol>\n        <button class=\"btn b2 sm\" style=\"margin-top:18px\" onclick=\"toast('Bản demo offline – chưa kết nối hệ thống tài khoản.')\">Tạo tài khoản mới<\/button><\/div>\n    <\/div>\n    <section class=\"blk\"><h2>Sau khi đăng nhập, hồ sơ đi qua 5 trạng thái<\/h2><div class=\"status\">${['Đã nộp','Đã tiếp nhận','Chờ thanh toán','Đang thử nghiệm','Đã trả kết quả'].map((s,i)=>`<div><b>${i+1}<\/b><span>${s}<\/span><\/div>`).join('')}<\/div><\/section><\/div>`;\n  },\n\n  'bang-gia'(){\n    return pageHead('Bảng giá thử nghiệm',[['#bang-gia','Bảng giá']],'Giá tạm tính theo từng loại hình, chưa gồm VAT. Giá chính thức theo thông báo giá Trung tâm ban hành sau khi tiếp nhận hồ sơ.','Price list') +\n    `<div class=\"wrap layout\"><div class=\"main\">\n      <section class=\"blk\"><h2>Giá tạm tính theo loại hình<\/h2>${tbl(['Loại hình thử nghiệm','Giá tạm tính',''],SERVICES.map(s=>[`<b>${s.name}<\/b>`,s.price,`<a href=\"#dich-vu/${s.id}\">Chi tiết →<\/a>`]))}\n        <p class=\"note\">Giá cuối cùng phụ thuộc số lượng mẫu, tiêu chuẩn áp dụng và số lần thử lặp. Dịch vụ chưa có trong bảng, vui lòng gửi yêu cầu báo giá.<\/p><\/section>\n      <section class=\"blk\"><h2>Gửi yêu cầu báo giá<\/h2>${regForm('moto')}<\/section>\n    <\/div><aside class=\"side\">${asideHelp()}<\/aside><\/div>`;\n  },\n\n  'van-ban'(){\n    const T=['Luật','Văn bản Chính phủ','Thông tư cấp Bộ'];\n    const docs=[]; ABOUT.laws.forEach((l,i)=>l.items.forEach(x=>docs.push([T[i]||l.t,'',x])));\n    ABOUT.stdCar.forEach(x=>docs.push(['Quy chuẩn, tiêu chuẩn',x[0],x[1]+' (ô tô, động cơ)']));\n    ABOUT.stdMoto.forEach(x=>docs.push(['Quy chuẩn, tiêu chuẩn',x[0],x[1]+' (mô tô, xe gắn máy)']));\n    const types=['Tất cả',...T,'Quy chuẩn, tiêu chuẩn'];\n    return pageHead('Văn bản pháp lý',[['#van-ban','Văn bản']],'Luật, văn bản Chính phủ, thông tư và quy chuẩn, tiêu chuẩn làm căn cứ cho hoạt động thử nghiệm.','Legal documents') +\n    `<div class=\"wrap layout\"><div class=\"main\">\n      <div class=\"doc-f\"><div class=\"pills\" id=\"docTypes\">${types.map((t,i)=>`<a href=\"javascript:void(0)\" class=\"${i?'':'on'}\" onclick=\"filterDocs(this,'${t}')\">${t}<\/a>`).join('')}<\/div>\n        <input id=\"docQ\" placeholder=\"Tìm theo số hiệu, trích yếu…\" oninput=\"filterDocs()\"><\/div>\n      <div class=\"tbl\"><table id=\"docTbl\"><thead><tr><th>STT<\/th><th>Loại văn bản<\/th><th>Số hiệu<\/th><th>Trích yếu nội dung<\/th><\/tr><\/thead><tbody>\n      ${docs.map((d,i)=>`<tr data-t=\"${d[0]}\"><td>${i+1}<\/td><td>${d[0]}<\/td><td><b>${d[1]||'—'}<\/b><\/td><td>${d[2]}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>\n      <p class=\"note\" id=\"docN\">Hiển thị ${docs.length} văn bản.<\/p>\n    <\/div><aside class=\"side\">${asideHelp()}<\/aside><\/div>`;\n  },\n\n  'hoi-dap'(){\n    return pageHead('Hỏi đáp',[['#hoi-dap','Hỏi đáp']],'Các câu hỏi thường gặp về hồ sơ, chi phí, thời gian và tài khoản khách hàng.','Q&A') +\n    `<div class=\"wrap layout\"><div class=\"main\">\n      <section class=\"blk\"><h2>Câu hỏi thường gặp<\/h2>${KB.map((k,i)=>`<div class=\"acc${i?'':' open'}\"><div class=\"acc-q\">${k.chip}<span>+<\/span><\/div><div class=\"acc-a\"><div>${k.a}<\/div><\/div><\/div>`).join('')}<\/section>\n      <section class=\"blk\"><h2>Gửi câu hỏi cho Trung tâm<\/h2><form class=\"form\" data-form=\"ask\">\n        <div class=\"fg2\"><label>Họ và tên *<input required name=\"name\"><\/label><label>Email nhận trả lời *<input required type=\"email\" name=\"email\"><\/label><\/div>\n        <label>Câu hỏi *<textarea required rows=\"4\" name=\"q\"><\/textarea><\/label><button class=\"btn b1\">Gửi câu hỏi<\/button><\/form><\/section>\n    <\/div><aside class=\"side\">${asideHelp()}<\/aside><\/div>`;\n  },\n\n  'so-do-trang'(){\n    const col=(t,items)=>`<div class=\"card\"><h3>${t}<\/h3><ul class=\"ulist\">${items.map(i=>`<li><a href=\"${i[0]}\">${i[1]}<\/a><\/li>`).join('')}<\/ul><\/div>`;\n    return pageHead('Sơ đồ trang',[['#so-do-trang','Sơ đồ trang']],'Toàn bộ chuyên mục của cổng thông tin.','Sitemap') +\n    `<div class=\"wrap layout\"><div class=\"main\"><div class=\"g2\">\n      ${col('Giới thiệu',ABOUT_TOC.map(t=>['#gioi-thieu/'+t[0],t[1]]))}\n      ${col('Tin tức – Thông báo',[['#tin-tuc','Tất cả tin tức'],['#tin-tuc/chung','Tin tức chung'],['#tin-tuc/chuyen-nganh','Tin tức chuyên ngành']])}\n      ${col('Dịch vụ thử nghiệm',[['#dich-vu','Tổng quan dịch vụ'],...SERVICES.map(s=>['#dich-vu/'+s.id,s.short]),['#bang-gia','Bảng giá'],['#dich-vu/dang-ky','Đăng ký thử nghiệm']])}\n      ${col('Hướng dẫn – Hỗ trợ',[['#quy-trinh','Quy trình xử lý hồ sơ'],['#van-ban','Văn bản pháp lý'],['#hoi-dap','Hỏi đáp'],['#lien-he','Liên hệ'],['#dashboard','Đăng nhập khách hàng']])}\n    <\/div><\/div><aside class=\"side\">${asideHelp()}<\/aside><\/div>`;\n  },\n\n  'tim-kiem'(q){\n    q = decodeURIComponent(q||''); const k = norm(q);\n    const hitsN = NEWS.filter(n=>norm(n.title+' '+n.body).includes(k));\n    const hitsS = SERVICES.filter(s=>norm(s.name+' '+s.desc).includes(k));\n    return pageHead(`Kết quả tìm kiếm`,[['','Tìm kiếm']],`Từ khóa: “${esc(q)}” · ${hitsN.length+hitsS.length} kết quả`) +\n    `<div class=\"wrap layout\"><div class=\"main\">${hitsS.length?`<h3 class=\"h3s\">Dịch vụ<\/h3><div class=\"g2\">${hitsS.map(x=>`<a class=\"card link\" href=\"#dich-vu/${x.id}\"><small>${x.code}<\/small><h3>${x.short}<\/h3><p>${x.lead}<\/p><\/a>`).join('')}<\/div>`:''}\n      ${hitsN.length?`<h3 class=\"h3s\">Tin tức<\/h3><div class=\"nlist\">${hitsN.map(newsRow).join('')}<\/div>`:''}\n      ${!hitsN.length&&!hitsS.length?'<p>Không tìm thấy nội dung phù hợp. Hãy thử hỏi trợ lý ảo.<\/p>':''}<\/div><aside class=\"side\">${asideHelp()}<\/aside><\/div>`;\n  }\n};\n\n/* ---------- router ---------- */\nfunction route(){\n  let h = decodeURIComponent(location.hash.slice(1)) || 'trang-chu';\n  const [p, ...rest] = h.split('/'); const sub = rest.join('/');\n  const app = $('#app');\n  app.innerHTML = (PAGES[p] ? PAGES[p](sub) : HOME());\n  $$('[data-nav]').forEach(a=>a.classList.toggle('active', a.dataset.nav === (PAGES[p]?p:'trang-chu')));\n  document.body.dataset.page = PAGES[p] ? p : 'home';\n  document.title = (p==='trang-chu'||!PAGES[p] ? '' : ($('.ph h1')?.textContent+' – ')) + 'NETC';\n  const anc = sub ? sub.split('/').pop() : '';\n  const el = anc ? document.getElementById(anc) : null;\n  if (el){ requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth'})); $$('[data-toc]').forEach(a=>a.classList.toggle('on',a.dataset.toc===anc)); }\n  else window.scrollTo(0,0);\n  closeMenu();\n  try{ if(window.parent!==window) window.parent.postMessage({netcRoute:location.hash},'*'); }catch(e){}\n  if (window.afterRender) afterRender();\n}\naddEventListener('hashchange', route);\ndocument.addEventListener('click', e=>{\n  const a=e.target.closest('a[href^=\"#\"]'); if(!a || a.target==='_blank' || e.ctrlKey || e.metaKey) return;\n  e.preventDefault(); const h=a.getAttribute('href');\n  if(h==='#'||h===location.hash) route(); else location.hash=h;\n});\n\n/* ---------- form & toast ---------- */\nfunction toast(msg){\n  let t = $('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }\n  t.innerHTML = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 4200);\n}\ndocument.addEventListener('submit', e=>{\n  const f = e.target; const k = f.dataset.form; if(!k) return; e.preventDefault();\n  if (k==='search'){ const q=f.q.value.trim(); if(q) location.hash='tim-kiem/'+encodeURIComponent(q); return; }\n  if (k==='reg'){ const code='NETC-2026-'+String(Math.floor(Math.random()*90000)+10000); toast(`✓ Đã ghi nhận đăng ký <b>(bản demo)<\/b>.<br>Mã hồ sơ tham khảo: <b>${code}<\/b>`); f.reset(); return; }\n  if (k==='ask'){ toast('✓ Đã gửi câu hỏi <b>(bản demo)<\/b>. Trung tâm sẽ phản hồi qua email.'); f.reset(); return; }\n  if (k==='login'){ toast('Bản demo offline – chưa kết nối hệ thống tài khoản.'); return; }\n});\n\n/* ---------- menu mobile ---------- */\nlet docType='Tất cả';\nfunction filterDocs(el,t){\n  if(el){ docType=t; $$('#docTypes a').forEach(a=>a.classList.toggle('on',a===el)); }\n  const q=norm(($('#docQ')||{}).value||''); let n=0;\n  $$('#docTbl tbody tr').forEach(r=>{ const ok=(docType==='Tất cả'||r.dataset.t===docType)&&norm(r.innerText).includes(q); r.style.display=ok?'':'none'; if(ok)n++; });\n  const o=$('#docN'); if(o) o.textContent='Hiển thị '+n+' văn bản.';\n}\ndocument.addEventListener('click',e=>{ const q=e.target.closest('.acc-q'); if(q) q.parentElement.classList.toggle('open'); });\nfunction toggleMenu(){ document.body.classList.toggle('menu-open'); }\nfunction closeMenu(){ document.body.classList.remove('menu-open'); }\n\n/* ---------- trợ lý ảo ---------- */\nlet chatStarted = false;\nfunction addMsg(html, who){ const d=document.createElement('div'); d.className='msg '+who; d.innerHTML=html; $('#chatBody').appendChild(d); $('#chatBody').scrollTop=1e9; }\nfunction reply(q){\n  const s = norm(q); let best=null, score=0;\n  KB.forEach(k=>{ const sc = k.keys.filter(x=>s.includes(norm(x))).length; if(sc>score){score=sc;best=k;} });\n  if (/quen mat khau/.test(s)) return 'Quên mật khẩu: chọn “Quên mật khẩu” tại màn hình đăng nhập để nhận liên kết đặt lại qua email. Cần hỗ trợ thêm, gọi (024).36893108.';\n  return best ? best.a : `Xin lỗi, tôi chưa có câu trả lời cho câu hỏi này. Bạn có thể chọn một chủ đề gợi ý bên dưới, hoặc liên hệ <a href=\"tel:${ORG.telRaw}\">${ORG.tel}<\/a> / ${ORG.email}.`;\n}\nfunction openChat(){\n  $('#chat').classList.add('show');\n  if(!chatStarted){ chatStarted=true; addMsg('Xin chào! Tôi là Trợ lý ảo NETC. Tôi có thể giúp bạn về quy trình, hồ sơ, báo giá tạm tính, thời gian xử lý, tài khoản và tiến độ hồ sơ.','bot');\n    $('#quick').innerHTML = KB.map(k=>`<button type=\"button\" onclick=\"ask('${k.chip}')\">${k.chip}<\/button>`).join(''); }\n  setTimeout(()=>$('#chatIn').focus(),50);\n}\nfunction toggleChat(){ $('#chat').classList.contains('show') ? $('#chat').classList.remove('show') : openChat(); }\nfunction ask(q){ openChat(); addMsg(esc(q),'me'); const t=document.createElement('div'); t.className='msg bot typing'; t.innerHTML='<i><\/i><i><\/i><i><\/i>'; $('#chatBody').appendChild(t); $('#chatBody').scrollTop=1e9;\n  setTimeout(()=>{ t.remove(); addMsg(reply(q),'bot'); }, 550); }\nfunction sendChat(){ const v=$('#chatIn').value.trim(); if(!v) return; $('#chatIn').value=''; ask(v); }\ndocument.addEventListener('keydown', e=>{ if(e.key==='Escape'){ $('#chat').classList.remove('show'); closeMenu(); } });\n\nconst CHAT_HTML = `<button class=\"fab\" onclick=\"toggleChat()\" aria-label=\"Trợ lý ảo\"><span class=\"fab-i\">✦<\/span><span class=\"fab-t\">Trợ lý ảo<\/span><\/button>\n<div class=\"chat\" id=\"chat\" role=\"dialog\" aria-label=\"Trợ lý ảo NETC\">\n  <div class=\"ch\"><div class=\"av\">AI<\/div><div><b>Trợ lý ảo NETC<\/b><small>● Trực tuyến · trả lời trong vài giây<\/small><\/div><button type=\"button\" onclick=\"toggleChat()\" aria-label=\"Đóng\">×<\/button><\/div>\n  <div class=\"cb\" id=\"chatBody\"><\/div><div class=\"quick\" id=\"quick\"><\/div>\n  <form class=\"cf\" onsubmit=\"event.preventDefault();sendChat()\"><input id=\"chatIn\" placeholder=\"Nhập câu hỏi của bạn…\" autocomplete=\"off\"><button aria-label=\"Gửi\">➤<\/button><\/form>\n  <div class=\"cnote\">Thông tin mang tính tham khảo. Báo giá và thời gian chính thức theo thông báo của Trung tâm.<\/div>\n<\/div>`;\ndocument.body.insertAdjacentHTML('beforeend', CHAT_HTML);\nroute();\n\n<\/script>\n<\/body>\n<\/html>\n"</script>

B',name:'Dịch vụ thử nghiệm liên quan khác',short:'Dịch vụ liên quan khác',\n   lead:'Thử nghiệm phục vụ nghiên cứu theo yêu cầu.',\n   desc:'Theo yêu cầu của khách hàng và năng lực thiết bị hiện có, Trung tâm nhận thử nghiệm phục vụ nghiên cứu: đánh giá nhiên liệu sinh học, kiểm tra hiệu quả và độ bền bộ xử lý khí thải, đo phát thải theo chu trình tùy biến.',\n   rows:[['Hợp đồng','Nội dung và chi phí được thống nhất bằng hợp đồng riêng trước khi thực hiện.']],\n   tags:['Nhiên liệu sinh học','Bộ xử lý khí thải','Chu trình tùy biến'],price:'Theo hợp đồng'}\n];\n\nconst STEPS = [\n  {t:'Đăng ký thử nghiệm và nộp hồ sơ',short:'Trực tuyến hoặc tại Trung tâm.',d:'Điền đơn đăng ký kèm bản đăng ký thông số kỹ thuật của kiểu loại, nộp trực tuyến qua tài khoản khách hàng hoặc nộp trực tiếp tại bộ phận một cửa của Trung tâm. Hồ sơ được cấp mã theo dạng NETC-2026-xxxxx ngay khi gửi thành công.'},\n  {t:'NETC tiếp nhận hồ sơ và mẫu thử',short:'Kiểm tra tính hợp lệ, niêm phong mẫu.',d:'Cán bộ kiểm tra tính đầy đủ, hợp lệ của hồ sơ và đối chiếu mẫu thử với thông số đã khai. Mẫu đạt yêu cầu được niêm phong và lập biên bản giao nhận. Hồ sơ thiếu thông tin sẽ được thông báo để bổ sung.'},\n  {t:'Ban hành thông báo giá và thanh toán',short:'Phát hành thông báo giá chính thức.',d:'Trung tâm phát hành thông báo giá chính thức theo số lượng mẫu, tiêu chuẩn áp dụng và số lần thử. Khách hàng thanh toán bằng chuyển khoản; hồ sơ được xếp lịch thử nghiệm sau khi xác nhận thanh toán.'},\n  {t:'Tiến hành thử nghiệm',short:'Đo phát thải theo chu trình.',d:'Mẫu được chạy rà, ổn định nhiệt độ trước khi đưa lên băng thử. Phép thử thực hiện theo chu trình đăng ký, dữ liệu phát thải ghi nhận tự động và lưu trong hệ thống quản lý phòng thử nghiệm. Khách hàng có thể đăng ký chứng kiến thử nghiệm.'},\n  {t:'Trả kết quả và trả mẫu thử',short:'Bản giấy hoặc điện tử.',d:'Báo cáo thử nghiệm được trả bản giấy tại Trung tâm hoặc bản điện tử qua tài khoản khách hàng. Mẫu thử được trả kèm biên bản bàn giao.'}\n];\nconst CHECKLIST = ['Đơn đăng ký thử nghiệm theo mẫu','Bản đăng ký thông số kỹ thuật kiểu loại','Ảnh tổng thể, số VIN và số động cơ','Giấy giới thiệu người liên hệ'];\n\nconst ABOUT = {\n  intro:['Trung tâm thử nghiệm khí thải phương tiện giao thông cơ giới đường bộ được thành lập ngày 21/09/2009 theo Quyết định số 2737/QĐ-BGTVT của Bộ trưởng Bộ Giao thông vận tải.','Trung tâm có tên giao dịch bằng tiếng Anh là NATIONAL MOTOR VEHICLE EMISSION TEST CENTER; viết tắt là NETC.','Trung tâm thực hiện theo hệ thống quản lý chất lượng theo tiêu chuẩn ISO 9001:2015, ISO/IEC 17025:2017 (Số hiệu VILAS 884), các sản phẩm, dịch vụ của Trung tâm NETC đảm bảo tính trung thực, tin cậy, nhanh chóng, rõ ràng.'],\n  facts:[['21/09/2009','Ngày thành lập'],['ISO 9001:2015','Hệ thống quản lý chất lượng'],['VILAS 884','ISO/IEC 17025:2017']],\n  duties:['Xây dựng, ban hành và tổ chức thực hiện kế hoạch hàng năm về công tác thử nghiệm khí thải, tiêu thụ nhiên liệu, năng lượng của phương tiện và thiết bị.','Đề xuất và tham gia xây dựng, bổ sung, sửa đổi quy chuẩn kỹ thuật quốc gia, tiêu chuẩn quốc gia và các văn bản quy phạm pháp luật có liên quan làm căn cứ cho việc thử nghiệm khí thải, tiêu thụ nhiên liệu, năng lượng của phương tiện và thiết bị để Cục trưởng trình cơ quan có thẩm quyền ban hành.','Cung cấp dịch vụ thử nghiệm khí thải, tiêu thụ nhiên liệu, năng lượng của phương tiện và thiết bị (bao gồm cả việc kiểm tra sự phù hợp của hệ thống khí thải, tiêu thụ nhiên liệu, năng lượng lắp đặt trên phương tiện); lập báo cáo thử nghiệm theo quy định.','Tham gia giám sát thử nghiệm, đánh giá điều kiện kỹ thuật của các cơ sở thử nghiệm.','Tham gia xây dựng và khai thác hệ thống quản lý cơ sở dữ liệu phương tiện và thiết bị của Cục Đăng kiểm Việt Nam. Tổ chức xây dựng và khai thác hệ thống quản lý cơ sở dữ liệu của Trung tâm.','Tổ chức thu giá thử nghiệm và giá dịch vụ theo quy định của pháp luật.','Tổ chức thực hiện công tác nghiên cứu khoa học, phát triển, ứng dụng tiến bộ khoa học và chuyển giao công nghệ liên quan đến công tác thử nghiệm phương tiện và thiết bị được giao.','Tổ chức thực hiện biên soạn tài liệu hướng dẫn nghiệp vụ, hướng dẫn nghiệp vụ, đánh giá nghiệp vụ Đăng kiểm viên thuộc lĩnh vực thử nghiệm khí thải, tiêu thụ nhiên liệu, năng lượng của phương tiện và thiết bị.','Tư vấn, hợp tác, liên doanh, liên kết với các tổ chức, cá nhân trong và ngoài nước để cung cấp các dịch vụ kỹ thuật liên quan đến thử nghiệm khí thải, tiêu thụ năng lượng của phương tiện và thiết bị theo quy định của pháp luật.','Duy trì hệ thống quản lý chất lượng theo các tiêu chuẩn có liên quan đến nhiệm vụ của đơn vị.','Thực hiện hợp tác quốc tế về thử nghiệm khí thải, tiêu thụ năng lượng của phương tiện và thiết bị theo quy định.','Quản lý hồ sơ thử nghiệm, hồ sơ cung cấp dịch vụ của đơn vị theo quy định của pháp luật.','Xây dựng và thực hiện chương trình cải cách hành chính của đơn vị theo mục tiêu và nội dung chương trình cải cách hành chính nhà nước của Cục Đăng kiểm Việt Nam.','Quản lý bộ máy, tuyển dụng viên chức, người lao động; thực hiện chế độ tiền lương và các chế độ, chính sách đãi ngộ khen thưởng, kỷ luật đối với viên chức và người lao động thuộc phạm vi quản lý của Trung tâm theo quy định của pháp luật.','Tham gia, xây dựng các chương trình, đề án, dự án liên quan đến thử nghiệm khí thải, tiêu thụ năng lượng của phương tiện và thiết bị được Cục Đăng kiểm Việt Nam giao.','Thực hiện các nhiệm vụ, quyền hạn khác do Cục trưởng Cục Đăng kiểm Việt Nam giao và theo quy định của pháp luật.'],\n  org:{top:'Cục Đăng kiểm Việt Nam',dir:'Giám đốc Trung tâm',dep:'Phó Giám đốc',units:['Phòng Tổ chức – Hành chính','Phòng Thử nghiệm xe cơ giới','Phòng Thử nghiệm động cơ và thiết bị','Phòng Nghiên cứu phát triển – Thiết bị vật tư']},\n  fields:[\n    {t:'4.1 Thử nghiệm khí thải',lead:'Phương tiện giao thông đường bộ theo tiêu chuẩn mức 2, 3, 4, 5',items:['Xe mô tô, xe máy 2 bánh, 3 bánh, 4 bánh','Xe ô tô hạng nhẹ','Động cơ ô tô hạng nặng']},\n    {t:'4.2 Đo tiêu thụ nhiên liệu / năng lượng',items:['Đo mức tiêu thụ nhiên liệu bằng phương pháp cân bằng cacbon','Đo mức tiêu thụ nhiên liệu bằng phương pháp đo trực tiếp','Đo mức tiêu thụ năng lượng đối với mô tô điện, xe máy điện, ô tô điện và ô tô hybrid điện hạng nhẹ']},\n    {t:'4.3 Dịch vụ kỹ thuật khác',items:['Thử nghiệm theo yêu cầu đối với các dịch vụ kỹ thuật theo quy định của Cục Đăng kiểm Việt Nam và của pháp luật.']}\n  ],\n  equip:'NETC được trang bị đầy đủ các thiết bị thử nghiệm đồng bộ được sản xuất tại Châu Âu cho phép thử nghiệm khí thải của xe cơ giới đến mức EURO 3 đối với xe mô tô, EURO 5 hoặc cao hơn đối với xe ô tô hạng nhẹ và động cơ hạng nặng theo yêu cầu của cơ quan quản lý nhà nước, phép thử loại 1, 2, 3, 4 và đo độ khói theo tiêu chuẩn Châu Âu, đã được tổ chức có uy tín nhất Châu Âu TUV (Đức) kiểm tra, đánh giá công nhận phòng thử nghiệm và hệ thống trang thiết bị đạt chuẩn.',\n  staff:'Trung tâm có đội ngũ Đăng kiểm viên, nhân viên được đào tạo chuyên sâu lĩnh vực thử nghiệm khí thải cả trong nước và nước ngoài, có thể thực hiện các nội dung thử nghiệm theo các quy trình, tiêu chuẩn, quy chuẩn kỹ thuật hiện hành cũng như triển khai các nghiên cứu phát triển tiên tiến hiện đại khác.',\n  leaders:[['Nguyễn Hoài Nam','Giám đốc','0243.689.3666'],['Lê Hồng Việt','Phó Giám đốc','0834554529']],\n  depts:[['Phòng Tổ chức – Hành chính','Trần Duy Mạnh','Trưởng phòng','0984666748'],['Phòng Thử nghiệm xe cơ giới','Nguyễn Văn Truyền','Trưởng phòng','0979875666'],['Phòng Thử nghiệm xe cơ giới','Nguyễn Đức Tuấn Hiệp','Phó Trưởng phòng','0973841357'],['Phòng Thử nghiệm động cơ và thiết bị','Hoàng Văn Tập','Trưởng phòng','0983.026.366'],['Phòng Nghiên cứu phát triển – Thiết bị vật tư','Nguyễn Hải Dương','Trưởng phòng','0812858580'],['Tiếp nhận & trả báo cáo thử nghiệm','Nguyễn Đặng Thiên Hương','Nhân viên','0962170052'],['Thu giá thử nghiệm / cấp phát hóa đơn','Nguyễn Vũ Ngọc','Nhân viên','0356991668']],\n  laws:[\n    {t:'8.1 Luật',items:['Luật Trật tự, an toàn giao thông đường bộ;','Luật Bảo vệ môi trường;','Luật Sử dụng năng lượng tiết kiệm và hiệu quả;','Luật Chất lượng sản phẩm, hàng hóa…']},\n    {t:'8.2 Văn bản Chính phủ',items:['Nghị định quy định chi tiết một số điều và biện pháp để tổ chức, hướng dẫn thi hành Luật Sử dụng năng lượng tiết kiệm và hiệu quả.','Nghị định 116/2017/NĐ-CP ngày 17/10/2017 của Chính phủ quy định điều kiện sản xuất, lắp ráp, nhập khẩu và kinh doanh dịch vụ bảo hành, bảo dưỡng ô tô (được sửa đổi, bổ sung bởi Nghị định 17/2020/NĐ-CP ngày 05/02/2020).','Quyết định số 19/2024/QĐ-TTg ngày 15/11/2024 của Thủ tướng Chính phủ quy định lộ trình áp dụng tiêu chuẩn khí thải đối với xe cơ giới nhập khẩu và sản xuất, lắp ráp.']},\n    {t:'8.3 Thông tư cấp Bộ',items:['Thông tư số 54/2024/TT-BGTVT ngày 15/11/2024 quy định về trình tự, thủ tục chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường xe cơ giới, xe máy chuyên dùng, phụ tùng xe cơ giới trong nhập khẩu.','Thông tư số 55/2024/TT-BGTVT ngày 15/11/2024 quy định về trình tự, thủ tục chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường xe cơ giới, xe máy chuyên dùng, phụ tùng xe cơ giới trong sản xuất, lắp ráp.','Thông tư 48/2024/TT-BGTVT ban hành các Quy chuẩn kỹ thuật quốc gia về chất lượng an toàn kỹ thuật và bảo vệ môi trường, tiêu thụ năng lượng xe cơ giới; xe máy chuyên dùng; phụ tùng xe cơ giới; thiết bị an toàn cho trẻ em.','Thông tư số 69/2025/TT-BXD quy định dán nhãn năng lượng đối với các phương tiện sử dụng năng lượng thuộc phạm vi quản lý của Bộ Xây dựng.','Thông tư số 70/2025/TT-BXD ban hành Quy chuẩn kỹ thuật quốc gia về khí thải mức 4 đối với xe mô tô hai bánh, xe gắn máy hai bánh sản xuất, lắp ráp và nhập khẩu mới.']}\n  ],\n  stdCar:[['QCVN 86:2024/BGTVT','Quy chuẩn kỹ thuật quốc gia về khí thải mức 4 đối với xe ô tô sản xuất, lắp ráp và nhập khẩu mới'],['QCVN 109:2024/BGTVT','Quy chuẩn kỹ thuật quốc gia về khí thải mức 5 đối với xe ô tô sản xuất, lắp ráp và nhập khẩu mới'],['QCVN 09:2024/BGTVT','Quy chuẩn quốc gia về chất lượng an toàn kỹ thuật và bảo vệ môi trường đối với xe ô tô'],['TCVN 6565:2006','Phương tiện giao thông đường bộ – Khí thải nhìn thấy được (khói) từ động cơ cháy do nén – Yêu cầu và phương pháp thử trong phê duyệt kiểu'],['TCVN 9854:2013','Phương tiện giao thông đường bộ – Ô tô con – Giới hạn tiêu thụ nhiên liệu và phương pháp xác định'],['TCVN 6567:2015','Phương tiện giao thông đường bộ – Khí thải gây ô nhiễm từ động cơ cháy do nén, động cơ cháy cưỡng bức sử dụng khí dầu mỏ hóa lỏng hoặc khí thiên nhiên lắp trên ô tô – Yêu cầu và phương pháp thử trong phê duyệt kiểu'],['TCVN 6785:2015','Phương tiện giao thông đường bộ – Khí thải gây ô nhiễm từ ô tô theo nhiên liệu dùng cho động cơ – Yêu cầu và phương pháp thử trong phê duyệt kiểu'],['TCVN 7792:2015','Phương tiện giao thông đường bộ – Khí thải CO2 và tiêu thụ nhiên liệu và/hoặc tiêu thụ năng lượng điện cho ô tô con dẫn động bằng động cơ đốt trong hoặc hệ dẫn động hybrid điện, và phương pháp đo tiêu thụ năng lượng điện cho xe M1, N1 dẫn động điện – Yêu cầu và phương pháp thử trong phê duyệt kiểu']],\n  stdMoto:[['QCVN 04:2024/BGTVT','Quy chuẩn kỹ thuật quốc gia về khí thải xe mô tô, xe gắn máy sản xuất, lắp ráp và nhập khẩu mới'],['QCVN 77:2024/BGTVT','Quy chuẩn kỹ thuật quốc gia về khí thải mức 3 đối với xe mô tô hai bánh sản xuất, lắp ráp và nhập khẩu mới'],['QCVN 29:2025/BGTVT','Quy chuẩn kỹ thuật quốc gia về khí thải mức 4 đối với xe mô tô, xe gắn máy hai bánh sản xuất, lắp ráp và nhập khẩu mới'],['TCVN 7357:2010','Phương tiện giao thông đường bộ – Khí thải gây ô nhiễm phát ra từ mô tô – Yêu cầu và phương pháp thử trong phê duyệt kiểu'],['TCVN 7358:2010','Phương tiện giao thông đường bộ – Khí thải gây ô nhiễm phát ra từ xe máy lắp động cơ cháy cưỡng bức – Yêu cầu và phương pháp thử trong phê duyệt kiểu'],['TCVN 9726:2013','Phương tiện giao thông đường bộ – Khí thải gây ô nhiễm, khí thải CO2 và tiêu thụ nhiên liệu của mô tô hai bánh lắp động cơ cháy cưỡng bức hoặc cháy do nén – Yêu cầu và phương pháp thử trong phê duyệt Mẫu thử kèm phụ kiện cần thiết (ắc quy, dầu nhớt, nhiên liệu theo yêu cầu).<\/li><\/ul>Với thử nghiệm mức tiêu thụ năng lượng cần bổ sung thông số hộp số, tỉ số truyền, khối lượng quán tính. Với hồ sơ đối chiếu báo cáo nước ngoài cần bản gốc báo cáo thử nghiệm và chứng chỉ của phòng thử nghiệm.\"},\n {chip:'Báo giá tạm tính',keys:['bao gia','báo giá','bao nhieu','bao nhiêu tiền','chi phi','chi phí','phi thu nghiem','phí thử nghiệm','le phi','lệ phí','đơn giá','giá thử','giá dịch vụ','tốn','het bao nhieu'],a:\"Báo giá tạm tính (chưa gồm VAT, tham khảo):<ul><li>Khí thải mô tô, xe gắn máy: từ 6.000.000 đ/mẫu.<\/li><li>Khí thải ô tô (chu trình đầy đủ): từ 24.000.000 đ/mẫu.<\/li><li>Mức tiêu thụ năng lượng: từ 18.000.000 đ/mẫu.<\/li><li>Đối chiếu/công nhận báo cáo nước ngoài: từ 4.000.000 đ/hồ sơ.<\/li><\/ul>Giá cuối cùng phụ thuộc số lượng mẫu, tiêu chuẩn áp dụng và số lần thử lặp. Trung tâm sẽ ban hành thông báo giá chính thức sau khi tiếp nhận hồ sơ.\"},\n {chip:'Thời gian xử lý',keys:['thoi gian','thời gian','bao lau','bao lâu','may ngay','mấy ngày','bao nhiêu ngày','khi nào có kết quả'],a:\"Thời gian thực hiện phụ thuộc loại hình thử nghiệm, số lượng mẫu và tiêu chuẩn áp dụng. Trung tâm sẽ trao đổi cụ thể với khách hàng khi tiếp nhận hồ sơ. Bạn có thể theo dõi trạng thái hồ sơ trong <a href='#dashboard'>tài khoản khách hàng<\/a> hoặc liên hệ (024).36893108 để được hỗ trợ.\"},\n {chip:'Tạo tài khoản & đăng nhập',keys:['tai khoan','tài khoản','dang nhap','đăng nhập','mat khau','mật khẩu','dashboard'],a:\"Cách tạo tài khoản và đăng nhập Dashboard khách hàng:<ol><li>Vào trang <a href='#dashboard'>Đăng nhập khách hàng<\/a>, chọn “Tạo tài khoản”.<\/li><li>Nhập mã số thuế doanh nghiệp, tên đơn vị, email và số điện thoại người liên hệ.<\/li><li>Xác thực mã OTP gửi về email.<\/li><li>NETC duyệt tài khoản, sau đó bạn đăng nhập bằng email và mật khẩu đã đặt.<\/li><\/ol>Quên mật khẩu: chọn “Quên mật khẩu” tại màn hình đăng nhập để nhận liên kết đặt lại qua email.\"},\n {chip:'Theo dõi tiến độ hồ sơ',keys:['theo doi','theo dõi','trang thai','trạng thái','tiến độ','tien do','mã hồ sơ','ma ho so','chậm','quá hạn'],a:\"Sau khi đăng nhập Dashboard, mục “Hồ sơ của tôi” hiển thị 5 trạng thái: Đã nộp → Đã tiếp nhận → Chờ thanh toán → Đang thử nghiệm → Đã trả kết quả. <a href='#dashboard'>Đăng nhập<\/a> để xem hồ sơ. Nếu cần hỗ trợ về hồ sơ, liên hệ (024).36893108 hoặc email netc@vr.org.vn kèm mã hồ sơ.\"},\n {chip:'Các dịch vụ thử nghiệm',keys:['dich vu','dịch vụ','thử nghiệm gì','loai hinh','loại hình'],a:\"NETC cung cấp: thử nghiệm khí thải mô tô – xe gắn máy; thử nghiệm khí thải ô tô; thử nghiệm mức tiêu thụ năng lượng; đối chiếu/công nhận báo cáo thử nghiệm nước ngoài; và các dịch vụ thử nghiệm liên quan khác theo yêu cầu. Chi tiết tại trang <a href='#dich-vu'>Dịch vụ<\/a>.\"},\n {chip:'Liên hệ & giờ làm việc',keys:['lien he','liên hệ','dia chi','địa chỉ','o dau','ở đâu','gio lam viec','giờ làm việc','điện thoại','email'],a:\"Trung tâm NETC – Km15+200, Quốc lộ 1A, Thôn Yên Phú, Xã Ngọc Hồi, Thành phố Hà Nội.<br>Điện thoại: (024).36893108 · Fax: (024).36893555 · Email: netc@vr.org.vn<br>Giờ làm việc: Thứ 2 – Thứ 6, 08:00–12:00 và 13:30–17:00 (nghỉ thứ 7, chủ nhật và ngày lễ). Bản đồ và biểu mẫu liên hệ tại trang <a href='#lien-he'>Liên hệ<\/a>.\"}\n];\n\n\nfunction HOME(){\n  const f=NEWS[0];\n  return `<div class=\"wrap hb-pad\">\n    <div class=\"hb-hero\"><a class=\"hb-big\" href=\"#tin-tuc/${f.id}\">${cover}<div class=\"tx\"><span>Tin nổi bật · ${f.date}<\/span><h3>${f.title}<\/h3><p>${f.body}<\/p><\/div><\/a>\n      ${box('Thông báo','#tin-tuc',B_NOTE()+`<div class=\"gv-li\" style=\"margin-top:10px;border-top:1px dashed var(--line);padding-top:10px\">${NEWS.slice(1,4).map(li).join('')}<\/div>`)}<\/div>\n    <div class=\"hb-quick\"><a href=\"#dich-vu/dang-ky\">${ico('reg')}Đăng ký thử nghiệm<\/a><a href=\"#quy-trinh\">${ico('flow')}Quy trình<\/a><a href=\"#bang-gia\">${ico('price')}Bảng giá<\/a><a href=\"#van-ban\">${ico('doc')}Văn bản<\/a )}<\/span><b>${s.short}<\/b><\/a>`).join('')}<\/div>`;\nconst B_STEP=()=>`<div class=\"gv-step\">${STEPS.map((s,i)=>`<div><i>${i+1}<\/i><b>${s.t}<\/b><\/div>`).join('')}<\/div>`;\nconst B_ABT=()=>`<div class=\"gv-abt\"><div>${ABOUT.intro.map(p=>`<p>${p}<\/p>`).join('')}<a class=\"btn b2 sm\" href=\"#gioi-thieu\">Xem chi tiết<\/a><\/div><div class=\"gv-fx\">${ABOUT.facts.map(f=>`<div><b>${f[0]}<\/b><span>${f[1]}<\/span><\/div>`).join('')}<div><b>TUV (Đức)<\/b><span>Đánh giá công nhận thiết bị<\/span><\/div><\/div><\/div>`;\nconst B_CT=()=>`<section class=\"gv-box\"><div class=\"gv-h\"><h2>Thông tin liên hệ<\/h2><a href=\"#lien-he\">Đầu mối theo công việc »<\/a><\/div><div class=\"gv-ct\"><div class=\"l\"><div class=\"row\"><span>Đơn vị<\/span><b>${ORG.name}<\/b><\/div><div class=\"row\"><span>Địa chỉ<\/span><b>${ORG.addr}<\/b><\/div><div class=\"row\"><span>Điện thoại<\/span><b>${ORG.tel}<\/b><\/div><div class=\"row\"><span>Fax<\/span><b>${ORG.fax}<\/b><\/div><div class=\"row\"><span>Email<\/span><b>${ORG.email}<\/b><\/div><div class=\"row\"><span>Giờ làm việc<\/span><b>${ORG.hours}<\/b><\/div><\/div><div class=\"map\"><div class=\"map-fb\">Bản đồ cần kết nối Internet<br>${ORG.lat}° N, ${ORG.lng}° E<\/div><iframe loading=\"lazy\" src=\"https://www.google.com/maps?q=${ORG.lat},${ORG.lng}&z=15&output=embed\" title=\"Bản đồ NETC\"><\/iframe><\/div><\/div><\/section>`;\nconst B_LD=()=>`<div class=\"gv-ld\">${ABOUT.leaders.map(l=>`<div><small>${l[1]}<\/small><b>${l[0]}<\/b><a href=\"tel:${l[2].replace(/\\D/g,'')}\">☎ ${l[2]}<\/a><\/div>`).join('')}<\/div>`;\nconst B_DOC=()=>`<div class=\"hb-doc\">${DOCS.map(d=>`<a href=\"#van-ban\"><b>${d[0]}<\/b><span>${d[1]}<\/span><\/a>`).join('')}<\/div>`;\nconst B_NOTE=()=>`<div class=\"gv-li\">${NOTICES.map(n=>`<a href=\"#tin-tuc/${n[0]}\"><span><b>${n[1]}<\/b><\/span><\/a>`).join('')}<\/div>`;\nconst B_STAT=()=>`<div class=\"gv-stat\"><div><b>—<\/b><span>Đang truy cập<\/span><\/div><div><b>—<\/b><span>Tổng lượt truy cập<\/span><\/div><\/div><p style=\"font-size:12px;color:#888;margin-top:8px\">Số liệu hiển thị khi kết nối hệ thống thống kê.<\/p>`;\nconst LINKS=[['https://xaydung.gov.vn','Bộ Xây dựng'],['https://dichvucong.gov.vn','Cổng Dịch vụ công Quốc gia'],['https://chinhphu.vn','Cổng Thông tin điện tử Chính phủ']];\nfunction afterRender(){}\nlet FZ=0; function fz(d){ FZ=d?Math.max(-1,Math.min(2,FZ+d)):0; document.body.style.zoom=1+FZ*0.08; }\ndocument.getElementById('ddSvc').innerHTML=SERVICES.map(s=>`<a href=\"#dich-vu/${s.id}\">${s.short}<\/a>`).join('')+'<a href=\"#bang-gia\">Bảng giá thử nghiệm<\/a><a href=\"#dich-vu/dang-ky\">Đăng ký thử nghiệm<\/a>';\ndocument.getElementById('gvTick').innerHTML=NEWS.slice(0,5).map(n=>`<a href=\"#tin-tuc/${n.id}\">${n.title} (${n.date})<\/a>`).join('');\ndocument.getElementById('gvDate').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});\n\n/* ===== KHUNG DÙNG CHUNG: router, trang con, form, trợ lý ===== */\nconst $ = (s, r=document) => r.querySelector(s);\nconst $$ = (s, r=document) => [...r.querySelectorAll(s)];\nconst esc = s => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');\nconst newsBy = id => NEWS.find(n => n.id === id);\nconst svcBy = id => SERVICES.find(s => s.id === id);\n\n/* ---------- khối dùng lại ---------- */\nfunction pageHead(title, crumbs, lead, kicker){\n  const c = [['#trang-chu','Trang chủ'], ...crumbs].map((x,i,a)=> i<a.length-1 ? `<a href=\"${x[0]}\">${x[1]}<\/a>` : `<span>${x[1]}<\/span>`).join('<i>/<\/i>');\n  return `<div class=\"ph\"><div class=\"wrap\"><nav class=\"crumbs\">${c}<\/nav>${kicker?`<div class=\"ph-k\">${kicker}<\/div>`:''}<h1>${title}<\/h1>${lead?`<p class=\"lead\">${lead}<\/p>`:''}<\/div><\/div>`;\n}\nfunction newsRow(n){\n  return `<a class=\"nrow\" href=\"#tin-tuc/${n.id}\"><span class=\"nd\">${n.date}<\/span><span class=\"nt\"><b>${esc(n.title)}<\/b><small>${GRP[n.grp]}<\/small><em>${esc(n.body)}<\/em><\/span><span class=\"na\">→<\/span><\/a>`;\n}\nfunction asideNews(){\n  return `<div class=\"side-b\"><h4>Chuyên mục<\/h4><a href=\"#tin-tuc/chung\">Tin tức chung<\/a><a href=\"#tin-tuc/chuyen-nganh\">Tin tức chuyên ngành<\/a><\/div>\n  <div class=\"side-b\"><h4>Thông báo nổi bật<\/h4>${NOTICES.map(n=>`<a class=\"dot\" href=\"#tin-tuc/${n[0]}\">${n[1]}<\/a>`).join('')}<\/div>`;\n}\nfunction asideHelp(){\n  return `<div class=\"side-b side-cta\"><h4>Hỏi trước khi gọi<\/h4><p>Phần lớn câu hỏi về hồ sơ, giá và thời gian đã có sẵn câu trả lời trong trợ lý ảo.<\/p><button class=\"btn b1 sm\" onclick=\"openChat()\">Mở trợ lý<\/button><\/div>\n  <div class=\"side-b\"><h4>Hotline<\/h4><a href=\"tel:${ORG.telRaw}\" class=\"big\">${ORG.tel}<\/a><a href=\"mailto:${ORG.email}\">${ORG.email}<\/a><\/div>`;\n}\nconst SVC_OPTS = SERVICES.map(s=>`<option value=\"${s.id}\">${s.short}<\/option>`).join('');\nfunction regForm(sel){\n  return `<form class=\"form\" data-form=\"reg\">\n    <div class=\"fg2\"><label>Tên đơn vị *<input required name=\"org\"><\/label><label>Mã số thuế *<input required name=\"tax\"><\/label><\/div>\n    <div class=\"fg2\"><label>Người liên hệ *<input required name=\"name\"><\/label><label>Điện thoại *<input required name=\"phone\" type=\"tel\"><\/label><\/div>\n    <label>Loại hình thử nghiệm<select name=\"type\">${SVC_OPTS.replace(`value=\"${sel}\"`,`value=\"${sel}\" selected`)}<\/select><\/label>\n    <label>Mô tả mẫu thử<textarea name=\"desc\" rows=\"3\" placeholder=\"Kiểu loại, số lượng mẫu, tiêu chuẩn áp dụng…\"><\/textarea><\/label>\n    <button class=\"btn b1\">Gửi đăng ký<\/button>\n    <p class=\"fnote\">Cán bộ tiếp nhận sẽ liên hệ để hướng dẫn hoàn thiện hồ sơ và ban hành thông báo giá.<\/p>\n  <\/form>`;\n}\nfunction tbl(head, rows){\n  return `<div class=\"tbl\"><table><thead><tr>${head.map(h=>`<th>${h}<\/th>`).join('')}<\/tr><\/thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}<\/td>`).join('')}<\/tr>`).join('')}<\/tbody><\/table><\/div>`;\n}\nfunction orgChart(){\n  const o = ABOUT.org;\n  return `<div class=\"org\"><div class=\"onode mid\">${o.dir}<\/div><div class=\"ov\"><\/div><div class=\"onode mid2\">${o.dep}<\/div><div class=\"ov\"><\/div><div class=\"olv\">${o.units.map(u=>`<div class=\"onode\">${u}<\/div>`).join('')}<\/div><\/div>`;\n}\n\n/* ---------- các trang ---------- */\nconst PAGES = {\n  'gioi-thieu'(sub){\n    const A = ABOUT;\n    const sec = (id,n,t,body)=>`<section class=\"blk\" id=\"${id}\"><div class=\"blk-n\">${n}<\/div><h2>${t}<\/h2>${body}<\/section>`;\n    return pageHead('Giới thiệu Trung tâm NETC',[['#gioi-thieu','Giới thiệu']],'Chức năng, nhiệm vụ, tổ chức bộ máy, lĩnh vực thử nghiệm và văn bản pháp lý của Trung tâm.','About NETC') +\n    `<div class=\"wrap layout\"><div class=\"main\">\n      ${sec('gt-chung','01','Giới thiệu chung',`${A.intro.map(p=>`<p>${p}<\/p>`).join('')}<div class=\"facts\">${A.facts.map(f=>`<div><b>${f[0]}<\/b><span>${f[1]}<\/span><\/div>`).join('')}<\/div>`)}\n      ${sec('gt-nhiem-vu','02','Chức năng, nhiệm vụ',`<ol class=\"olist\">${A.duties.map(d=>`<li>${d}<\/li>`).join('')}<\/ol>`)}\n      ${sec('gt-to-chuc','03','Sơ đồ tổ chức',orgChart())}\n      ${sec('gt-linh-vuc','04','Các lĩnh vực thử nghiệm',`<div class=\"g3\">${A.fields.map(f=>`<div class=\"card\"><h3>${f.t}<\/h3>${f.lead?`<p>${f.lead}<\/p>`:''}<ul class=\"ulist\">${f.items.map(i=>`<li>${i}<\/li>`).join('')}<\/ul><\/div>`).join('')}<\/div>`)}\n      ${sec('gt-thiet-bi','05','Trang thiết bị',`<p>${A.equip}<\/p>`)}\n      ${sec('gt-nhan-luc','06','Đội ngũ cán bộ kỹ thuật',`<p>${A.staff}<\/p>`)}\n      ${sec('gt-ho-tro','07','Thông tin hỗ trợ khách hàng',`<h3 class=\"h3s\">7.1 Lãnh đạo Trung tâm<\/h3>${tbl(['STT','Họ và tên','Chức vụ','Điện thoại'],A.leaders.map((l,i)=>[i+1,l[0],l[1],`<a href=\"tel:${l[2].replace(/\\D/g,'')}\">${l[2]}<\/a>`]))}<h3 class=\"h3s\">7.2 Các phòng nghiệp vụ<\/h3>${tbl(['Phòng nghiệp vụ','Cán bộ hướng dẫn','Chức vụ','Điện thoại'],A.depts.map(d=>[d[0],d[1],d[2],`<a href=\"tel:${d[3].replace(/\\D/g,'')}\">${d[3]}<\/a>`]))}`)}\n      ${sec('gt-van-ban','08','Văn bản pháp lý',`${A.laws.map(l=>`<h3 class=\"h3s\">${l.t}<\/h3><ul class=\"ulist\">${l.items.map(i=>`<li>${i}<\/li>`).join('')}<\/ul>`).join('')}<h3 class=\"h3s\">8.4 Quy chuẩn, tiêu chuẩn<\/h3><p class=\"cap\">Đối với ô tô, động cơ<\/p>${tbl(['Số hiệu','Tên văn bản'],A.stdCar.map(r=>[`<b>${r[0]}<\/b>`,r[1]]))}<p class=\"cap\">Đối với xe mô tô, xe gắn máy<\/p>${tbl(['Số hiệu','Tên văn bản'],A.stdMoto.map(r=>[`<b>${r[0]}<\/b>`,r[1]]))}`)}\n    <\/div><aside class=\"side\"><div class=\"side-b sticky\"><h4>Trong chuyên mục này<\/h4>${ABOUT_TOC.map(t=>`<a href=\"#gioi-thieu/${t[0]}\" data-toc=\"${t[0]}\">${t[1]}<\/a>`).join('')}<\/div>\n      <div class=\"side-b\"><h4>Lãnh đạo đơn vị<\/h4>${A.leaders.map(l=>`<div class=\"ldr\"><small>${l[1]}<\/small><b>${l[0]}<\/b><a href=\"tel:${l[2].replace(/\\D/g,'')}\">☎ ${l[2]}<\/a><\/div>`).join('')}<\/div><\/aside><\/div>`;\n  },\n\n  'tin-tuc'(sub){\n    if (sub && sub.startsWith('tin-')){\n      const n = newsBy(sub); if(!n) return PAGES['tin-tuc']();\n      const gl = n.grp==='chung'?'chung':'chuyen-nganh';\n      const rel = NEWS.filter(x=>x.grp===n.grp && x.id!==n.id);\n      return pageHead(esc(n.title),[['#tin-tuc','Tin tức'],[`#tin-tuc/${gl}`,GRP[n.grp]],['','Chi tiết']],'',`${GRP[n.grp]} · ${n.date}`) +\n      `<div class=\"wrap layout\"><div class=\"main\"><article class=\"article\"><div class=\"art-cover\"><span>${GRP[n.grp]}<\/span><\/div><p class=\"art-date\">📅 ${n.date}<\/p><p class=\"art-body\">${esc(n.body)}<\/p>\n        <div class=\"art-foot\"><a class=\"btn b2 sm\" href=\"#tin-tuc/${gl}\">« Quay lại ${GRP[n.grp].toLowerCase()}<\/a><\/div><\/article>\n        <h3 class=\"h3s\">Tin khác cùng chuyên mục<\/h3><div class=\"nlist\">${rel.map(newsRow).join('')}<\/div><\/div>\n        <aside class=\"side\">${asideNews()}<\/aside><\/div>`;\n    }\n    const f = sub==='chung'?'chung':sub==='chuyen-nganh'?'nganh':'all';\n    const list = NEWS.filter(n=>f==='all'||n.grp===f);\n    const title = f==='all'?'Tin tức':GRP[f];\n    return pageHead(title,[['#tin-tuc','Tin tức'],...(f==='all'?[]:[['',GRP[f]]])],'Thay đổi quy trình, lịch bảo trì hệ thống, lịch nghỉ lễ và tin chuyên ngành của Trung tâm.','Newsroom') +\n    `<div class=\"wrap layout\"><div class=\"main\"><div class=\"pills\"><a href=\"#tin-tuc\" class=\"${f==='all'?'on':''}\">Tất cả<\/a><a href=\"#tin-tuc/chung\" class=\"${f==='chung'?'on':''}\">Tin tức chung<\/a><a href=\"#tin-tuc/chuyen-nganh\" class=\"${f==='nganh'?'on':''}\">Tin tức chuyên ngành<\/a><\/div>\n      <div class=\"nlist\">${list.map(newsRow).join('')}<\/div><\/div><aside class=\"side\">${asideNews()}<\/aside><\/div>`;\n  },\n\n  'dich-vu'(sub){\n    const s = svcBy((sub||'').split('/')[0]);\n    const side = `<div class=\"side-b\"><h4>Các dịch vụ<\/h4>${SERVICES.map(x=>`<a href=\"#dich-vu/${x.id}\" class=\"${s&&s.id===x.id?'on':''}\">${x.short}<\/a>`).join('')}<\/div>\n      <div class=\"side-b side-cta\"><h4>Ước tính chi phí<\/h4><p>Trợ lý ảo đưa ra khoảng giá tạm tính theo từng loại hình trước khi bạn nộp hồ sơ.<\/p><button class=\"btn b1 sm\" onclick=\"ask('Báo giá tạm tính')\">Hỏi báo giá tạm tính<\/button><\/div>`;\n    if (s){\n      return pageHead(s.name,[['#dich-vu','Dịch vụ'],['',s.short]],s.lead,s.code) +\n      `<div class=\"wrap layout\"><div class=\"main\">\n        <div class=\"svc-hero sv-${s.id}\"><div><span class=\"tag\">${s.code}<\/span><div class=\"kp\"><div><small>Giá tạm tính*<\/small><b>${s.price}<\/b><\/div><\/div><\/div><\/div>\n        <section class=\"blk\"><h2>Mô tả dịch vụ<\/h2><p>${s.desc}<\/p><div class=\"chips-s\">${s.tags.map(t=>`<span>${t}<\/span>`).join('')}<\/div><\/section>\n        <section class=\"blk\"><h2>Thông tin cần biết<\/h2><dl class=\"dl\">${s.rows.map(r=>`<dt>${r[0]}<\/dt><dd>${r[1]}<\/dd>`).join('')}<\/dl><p class=\"fnote\">* able><\/div>\n      <p class=\"note\" id=\"docN\">Hiển thị ${docs.length} văn bản.<\/p>\n    <\/div><aside class=\"side\">${asideHelp()}<\/aside><\/div>`;\n  },\n\n  'hoi-dap'(){\n    return pageHead('Hỏi đáp',[['#hoi-dap','Hỏi đáp']],'Các câu hỏi thường gặp về hồ sơ, chi phí, thời gian và tài khoản khách hàng.','Q&A') +\n    `<div class=\"wrap layout\"><div class=\"main\">\n      <section class=\"blk\"><h2>Câu hỏi thường gặp<\/h2>${KB.map((k,i)=>`<div class=\"acc${i?'':' open'}\"><div class=\"acc-q\">${k.chip}<span>+<\/span><\/div><div class=\"acc-a\"><div>${k.a}<\/div><\/div><\/div>`).join('')}<\/section>\n      <section class=\"blk\"><h2>Gửi câu hỏi cho Trung tâm<\/h2><form class=\"form\" data-form=\"ask\">\n        <div class=\"fg2\"><label>Họ và tên *<input required name=\"name\"><\/label><label>Email nhận trả lời *<input required type=\"email\" name=\"email\"><\/label><\/div>\n        <label>Câu hỏi *<textarea required rows=\"4\" name=\"q\"><\/textarea><\/label><button class=\"btn b1\">Gửi câu hỏi<\/button><\/form><\/section>\n    <\/div><aside class=\"side\">${asideHelp()}<\/aside><\/div>`;\n  },\n\n  'so-do-trang'(){\n    const col=(t,items)=>`<div class=\"card\"><h3>${t}<\/h3><ul class=\"ulist\">${items.map(i=>`<li><a href=\"${i[0]}\">${i[1]}<\/a><\/li>`).join('')}<\/ul><\/div>`;\n    return pageHead('Sơ đồ trang',[['#so-do-trang','Sơ đồ trang']],'Toàn bộ chuyên mục của cổng thông tin.','Sitemap') +\n    `<div class=\"wrap layout\"><div class=\"main\"><div class=\"g2\">\n      ${col('Giới thiệu',ABOUT_TOC.map(t=>['#gioi-thieu/'+t[0],t[1]]))}\n      ${col('Tin tức – Thông báo',[['#tin-tuc','Tất cả tin tức'],['#tin-tuc/chung','Tin tức chung'],['#tin-tuc/chuyen-nganh','Tin tức chuyên ngành']])}\n      ${col('Dịch vụ thử nghiệm',[['#dich-vu','Tổng quan dịch vụ'],...SERVICES.map(s=>['#dich-vu/'+s.id,s.short]),['#bang-gia','Bảng giá'],['#dich-vu/dang-ky','Đăng ký thử nghiệm']])}\n      ${col('Hướng dẫn – Hỗ trợ',[['#quy-trinh','Quy trình xử lý hồ sơ'],['#van-ban','Văn bản pháp lý'],['#hoi-dap','Hỏi đáp'],['#lien-he','Liên hệ'],['#dashboard','Đăng nhập khách hàng']])}\n    <\/div><\/div><aside class=\"side\">${asideHelp()}<\/aside><\/div>`;\n  },\n\n  'tim-kiem'(q){\n    q = decodeURIComponent(q||''); const k = norm(q);\n    const hitsN = NEWS.filter(n=>norm(n.title+' '+n.body).includes(k));\n    const hitsS = SERVICES.filter(s=>norm(s.name+' '+s.desc).includes(k));\n    return pageHead(`Kết quả tìm kiếm`,[['','Tìm kiếm']],`Từ khóa: “${esc(q)}” · ${hitsN.length+hitsS.length} kết quả`) +\n    `<div class=\"wrap layout\"><div class=\"main\">${hitsS.length?`<h3 class=\"h3s\">Dịch vụ<\/h3><div class=\"g2\">${hitsS.map(x=>`<a class=\"card link\" href=\"#dich-vu/${x.id}\"><small>${x.code}<\/small><h3>${x.short}<\/h3><p>${x.lead}<\/p><\/a>`).join('')}<\/div>`:''}\n      ${hitsN.length?`<h3 class=\"h3s\">Tin tức<\/h3><div class=\"nlist\">${hitsN.map(newsRow).join('')}<\/div>`:''}\n      ${!hitsN.length&&!hitsS.length?'<p>Không tìm thấy nội dung phù hợp. Hãy thử hỏi trợ lý ảo.<\/p>':''}<\/div><aside class=\"side\">${asideHelp()}<\/aside><\/div>`;\n  }\n};\n\n/* ---------- router ---------- */\nfunction route(){\n  let h = decodeURIComponent(location.hash.slice(1)) || 'trang-chu';\n  const [p, ...rest] = h.split('/'); const sub = rest.join('/');\n  const app = $('#app');\n  app.innerHTML = (PAGES[p] ? PAGES[p](sub) : HOME());\n  $$('[data-nav]').forEach(a=>a.classList.toggle('active', a.dataset.nav === (PAGES[p]?p:'trang-chu')));\n  document.body.dataset.page = PAGES[p] ? p : 'home';\n  document.title = (p==='trang-chu'||!PAGES[p] ? '' : ($('.ph h1')?.textContent+' – ')) + 'NETC';\n  const anc = sub ? sub.split('/').pop() : '';\n  const el = anc ? document.getElementById(anc) : null;\n  if (el){ requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth'})); $$('[data-toc]').forEach(a=>a.classList.toggle('on',a.dataset.toc===anc)); }\n  else window.scrollTo(0,0);\n  closeMenu();\n  try{ if(window.parent!==window) window.parent.postMessage({netcRoute:location.hash},'*'); }catch(e){}\n  if (window.afterRender) afterRender();\n}\naddEventListener('hashchange', route);\ndocument.addEventListener('click', e=>{\n  const a=e.target.closest('a[href^=\"#\"]'); if(!a || a.target==='_blank' || e.ctrlKey || e.metaKey) return;\n  e.preventDefault(); const h=a.getAttribute('href');\n  if(h==='#'||h===location.hash) route(); else location.hash=h;\n});\n\n/* ---------- form & toast ---------- */\nfunction toast(msg){\n  let t = $('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }\n  t.innerHTML = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 4200);\n}\ndocument.addEventListener('submit', e=>{\n  const f = e.target; const k = f.dataset.form; if(!k) return; e.preventDefault();\n  if (k==='search'){ const q=f.q.value.trim(); if(q) location.hash='tim-kiem/'+encodeURIComponent(q); return; }\n  if (k==='reg'){ const code='NETC-2026-'+String(Math.floor(Math.random()*90000)+10000); toast(`✓ Đã ghi nhận đăng ký <b>(bản demo)<\/b>.<br>Mã hồ sơ tham khảo: <b>${code}<\/b>`); f.reset(); return; }\n  if (k==='ask'){ toast('✓ Đã gửi câu hỏi <b>(bản demo)<\/b>. Trung tâm sẽ phản hồi qua email.'); f.reset(); return; }\n  if (k==='login'){ toast('Bản demo offline – chưa kết nối hệ thống tài khoản.'); return; }\n});\n\n/* ---------- menu mobile ---------- */\nlet docType='Tất cả';\nfunction filterDocs(el,t){\n  if(el){ docType=t; $$('#docTypes a').forEach(a=>a.classList.toggle('on',a===el)); }\n  const q=norm(($('#docQ')||{}).value||''); let n=0;\n  $$('#docTbl tbody tr').forEach(r=>{ const ok=(docType==='Tất cả'||r.dataset.t===docType)&&norm(r.innerText).includes(q); r.style.display=ok?'':'none'; if(ok)n++; });\n  const o=$('#docN'); if(o) o.textContent='Hiển thị '+n+' văn bản.';\n}\ndocument.addEventListener('click',e=>{ const q=e.target.closest('.acc-q'); if(q) q.parentElement.classList.toggle('open'); });\nfunction toggleMenu(){ document.body.classList.toggle('menu-open'); }\nfunction closeMenu(){ document.body.classList.remove('menu-open'); }\n\n/* ---------- trợ lý ảo ---------- */\nlet chatStarted = false;\nfunction addMsg(html, who){ const d=document.createElement('div'); d.className='msg '+who; d.innerHTML=html; $('#chatBody').appendChild(d); $('#chatBody').scrollTop=1e9; }\nfunction reply(q){\n  const s = norm(q); let best=null, score=0;\n  KB.forEach(k=>{ const sc = k.keys.filter(x=>s.includes(norm(x))).length; if(sc>score){score=sc;best=k;} });\n  if (/quen mat khau/.test(s)) return 'Quên mật khẩu: chọn “Quên mật khẩu” tại màn hình đăng nhập để nhận liên kết đặt lại qua email. Cần hỗ trợ thêm, gọi (024).36893108.';\n  return best ? best.a : `Xin lỗi, tôi chưa có câu trả lời cho câu hỏi này. Bạn có thể chọn một chủ đề gợi ý bên dưới, hoặc liên hệ <a href=\"tel:${ORG.telRaw}\">${ORG.tel}<\/a> / ${ORG.email}.`;\n}\nfunction openChat(){\n  $('#chat').classList.add('show');\n  if(!chatStarted){ chatStarted=true; addMsg('Xin chào! Tôi là Trợ lý ảo NETC. Tôi có thể giúp bạn về quy trình, hồ sơ, báo giá tạm tính, thời gian xử lý, tài khoản và tiến độ hồ sơ.','bot');\n    $('#quick').innerHTML = KB.map(k=>`<button type=\"button\" onclick=\"ask('${k.chip}')\">${k.chip}<\/button>`).join(''); }\n  setTimeout(()=>$('#chatIn').focus(),50);\n}\nfunction toggleChat(){ $('#chat').classList.contains('show') ? $('#chat').classList.remove('show') : openChat(); }\nfunction ask(q){ openChat(); addMsg(esc(q),'me'); const t=document.createElement('div'); t.className='msg bot typing'; t.innerHTML='<i><\/i><i><\/i><i><\/i>'; $('#chatBody').appendChild(t); $('#chatBody').scrollTop=1e9;\n  setTimeout(()=>{ t.remove(); addMsg(reply(q),'bot'); }, 550); }\nfunction sendChat(){ const v=$('#chatIn').value.trim(); if(!v) return; $('#chatIn').value=''; ask(v); }\ndocument.addEventListener('keydown', e=>{ if(e.key==='Escape'){ $('#chat').classList.remove('show'); closeMenu(); } });\n\nconst CHAT_HTML = `<button class=\"fab\" onclick=\"toggleChat()\" aria-label=\"Trợ lý ảo\"><span class=\"fab-i\">✦<\/span><span class=\"fab-t\">Trợ lý ảo<\/span><\/button>\n<div class=\"chat\" id=\"chat\" role=\"dialog\" aria-label=\"Trợ lý ảo NETC\">\n  <div class=\"ch\"><div class=\"av\">AI<\/div><div><b>Trợ lý ảo NETC<\/b><small>● Trực tuyến · trả lời trong vài giây<\/small><\/div><button type=\"button\" onclick=\"toggleChat()\" aria-label=\"Đóng\">×<\/button><\/div>\n  <div class=\"cb\" id=\"chatBody\"><\/div><div class=\"quick\" id=\"quick\"><\/div>\n  <form class=\"cf\" onsubmit=\"event.preventDefault();sendChat()\"><input id=\"chatIn\" placeholder=\"Nhập câu hỏi của bạn…\" autocomplete=\"off\"><button aria-label=\"Gửi\">➤<\/button><\/form>\n  <div class=\"cnote\">Thông tin mang tính tham khảo. Báo giá và thời gian chính thức theo thông báo của Trung tâm.<\/div>\n<\/div>`;\ndocument.body.insertAdjacentHTML('beforeend', CHAT_HTML);\nroute();\n\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script>
const K=["a","b","c"], fr=document.getElementById('fr'), src={};
const html=k=>src[k]||(src[k]=JSON.parse(document.getElementById('tpl-'+k).textContent));
let cur=null;
let lastRoute='';
addEventListener('message',ev=>{ if(ev.source===fr.contentWindow && ev.data && typeof ev.data.netcRoute==='string') lastRoute=ev.data.netcRoute; });
function getRoute(){ try{ const h=fr.contentWindow.location.hash; if(h&&h.length>1) return h; }catch(e){} return lastRoute&&lastRoute.length>1?lastRoute:''; }
function show(k,keep){
  const route = keep ? getRoute() : '';
  cur=k;
  let t=html(k);
  if(route){ t=t.replace('<head>','<head><script>try{location.hash='+JSON.stringify(route)+'}catch(e){}<\/script>'); }
  fr.srcdoc=t;
  document.querySelectorAll('#opts button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  try{ history.replaceState(null,'','#'+k); }catch(e){ try{ location.hash=k; }catch(e2){} }
}
document.querySelectorAll('#opts button').forEach(b=>b.onclick=()=>show(b.dataset.k,true));
document.getElementById('newtab').onclick=()=>{
  try{ const u=URL.createObjectURL(new Blob([html(cur)],{type:'text/html'})); const w=window.open(u+(getRoute()||''),'_blank'); if(!w) throw 0; }
  catch(e){ const w=window.open('','_blank'); if(w){ w.document.open(); w.document.write(html(cur)); w.document.close(); } }
};
addEventListener('hashchange',()=>{ const k=location.hash.slice(1); if(k!==cur&&K.includes(k)) show(k,true); });
let k0=''; try{ k0=location.hash.slice(1); }catch(e){}
show(K.includes(k0)?k0:K[0],false);
</script>
